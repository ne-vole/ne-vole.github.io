<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">NeVOLE – Veřejná média patří veřejnosti.</title>
  <desc id="desc">Světlý občanský plakát s černým pruhem, bílým a červeným titulkem.</desc>
  <rect width="1200" height="630" fill="#f2efe6"/>
  <text x="64" y="83" fill="#a82b20" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="4">OBČANÉ NEJSOU KOMPARS.</text>
  <g transform="translate(1052 38) rotate(-3 42 42)">
    <rect width="84" height="84" fill="#e83b2d"/>
    <text x="42" y="57" fill="#fffdf7" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" text-anchor="middle">N!</text>
  </g>
  <rect y="132" width="1200" height="244" fill="#111714"/>
  <text x="58" y="318" fill="#fffdf7" font-family="Georgia, 'Times New Roman', serif" font-size="142" font-weight="500" letter-spacing="-8">Veřejná média</text>
  <text x="58" y="503" fill="#e83b2d" font-family="Georgia, 'Times New Roman', serif" font-size="122" font-weight="500" font-style="italic" letter-spacing="-6">patří veřejnosti.</text>
  <line x1="64" y1="560" x2="1136" y2="560" stroke="#c8c4b8" stroke-width="2"/>
  <text x="64" y="602" fill="#5f625b" font-family="Arial, Helvetica, sans-serif" font-size="24">Nezávislá občanská iniciativa</text>
</svg>
